<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Naskh";
  src: url("file:///workspace/.grok/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Bold.ttf") format("truetype");
  font-weight: 700;
  font-style: normal;
}
html, body {
  margin: 0;
  padding: 0;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #0B1F3A;
}
.card {
  position: relative;
  width: 1200px;
  height: 630px;
  background:
    url("file:///workspace/artifacts/imagine_images/9733f1a3-65be-4744-8b04-da2b991bc004.jpg")
    center / cover no-repeat;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 58% 72% at 50% 48%, rgba(11, 31, 58, 0.28) 0%, rgba(11, 31, 58, 0.58) 100%);
}
.frame {
  position: absolute;
  inset: 24px;
  border: 1.5px solid rgba(214, 181, 106, 0.7);
  z-index: 2;
  pointer-events: none;
}
.frame::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(21, 147, 201, 0.45);
}
.lockup {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.logo-wrap {
  width: 236px;
  height: 236px;
  border-radius: 50%;
  overflow: hidden;
  background: #0B1F3A;
  box-shadow:
    0 0 0 3px #D6B56A,
    0 0 0 6px rgba(11, 31, 58, 0.85),
    0 14px 36px rgba(0, 0, 0, 0.5);
  flex-shrink: 0;
}
.logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.title {
  margin: 20px 0 0;
  max-width: 820px;
  font-family: Naskh, serif;
  font-weight: 700;
  font-size: 54px;
  line-height: 1.3;
  color: #FFFFFF;
  direction: rtl;
  text-align: center;
  text-shadow: 0 2px 16px rgba(11, 31, 58, 0.95), 0 0 2px rgba(11, 31, 58, 1);
}
.rule {
  width: 96px;
  height: 2px;
  margin: 12px 0 10px;
  background: #D6B56A;
}
.sub {
  font-family: "DejaVu Serif", Georgia, "Times New Roman", serif;
  font-size: 17px;
  font-weight: 400;
  letter-spacing: 0.22em;
  color: #D6B56A;
  text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(11, 31, 58, 0.95);
}
</style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>
    <div class="lockup">
      <div class="logo-wrap">
        <img src="file:///workspace/.grok/logo-circle.png" alt="">
      </div>
      <div class="title">هیأت شطرنج شهرستان نیشابور</div>
      <div class="rule"></div>
      <div class="sub">Neyshabur Chess Association</div>
    </div>
  </div>
</body>
</html>
